[project]
name = "soc-triage-agent"
version = "0.1.0"
description = "LLM agent that triages SOC alerts like a Tier-1 analyst, with an eval harness and a prompt-injection robustness study."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "duckdb>=1.0",
  "pyarrow>=15",
  "pyyaml>=6",
  "httpx>=0.27",
  "anthropic>=1.0",
  "openai>=1.40",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
train = ["unsloth", "trl", "peft", "datasets", "transformers"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*", "api*", "data*", "evals*", "training*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
